[tile-description]
wooden-flooring=Decorative wooden flooring for dry land, edged with a raised wooden bumper where it meets water. Not placeable over water -- for a crossing, use the Wooden Ford.
wooden-ford=A ford over navigable water: a submerged wooden platform with stone ballast, walkable for land caravans while ships still sail over it and vehicles are stopped at the shore. Wooden pilings mark the crossing in the shallows. Place on water only.
cobblestone-ford=A road ford over navigable water: a cobblestone causeway that vehicles drive across while players, land caravans and enemies are stopped at the shore, and ships still sail over it. Place on water only.
cobblestone-path=Cobblestone paving for dry land. Not placeable over water -- for a crossing, use the Cobblestone Ford.

[mod-name]
water-ford=Water Ford

[mod-description]
water-ford=A walkable ford tile over water: land caravans can cross, wooden pilings stand semi-submerged in animated water, and ships still sail over it for Cargo Ships waterways. Vehicles are stopped at the shore and offshore pumps cannot be placed on it. Includes a matching Wooden Flooring for dry land.

[water-ford-messages]
placement-denied=Wooden Ford can only be placed on water
placement-denied-cobble=Cobblestone Ford can only be placed on water
